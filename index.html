<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Us 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Quicksand', sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: radial-gradient(circle at top, #ffe6f0, #fff5f8);
  position: relative;
}

/* soft pattern background */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url("https://www.transparenttextures.com/patterns/flowers.png");
  opacity: 0.08;
  z-index: -2;
}

/* floating hearts */
.heart {
  position: absolute;
  color: rgba(255, 105, 180, 0.25);
  animation: floatUp 10s linear infinite;
  font-size: 18px;
  z-index: -1;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) scale(1); opacity: 0; }
  50% { opacity: 0.25; }
  100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
}

/* header */
header {
  text-align: center;
  padding: 60px 20px 30px;
}

header h1 {
  font-size: 2.5rem;
  color: #ff4d88;
}

header p {
  margin-top: 10px;
  color: #555;
}

/* gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  padding: 30px;
  max-width: 1000px;
  margin: auto;
}

.photo {
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transform: scale(1);
  transition: 0.4s ease;
  background: white;
}

.photo:hover {
  transform: scale(1.05);
}

.photo img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
}

/* love message box */
.message {
  max-width: 700px;
  margin: 40px auto;
  text-align: center;
  padding: 20px;
  color: #444;
  font-size: 1.1rem;
}
</style>
</head>

<body>

<header>
  <h1>Happy 3 Months 💖</h1>
  <p>Every moment with you feels like a dream</p>
</header>

<!-- 10 images gallery -->
<div class="gallery">

  <!-- replace src with your 10 images -->
  <div class="photo"><img src="img1.jpg"></div>
  <div class="photo"><img src="img2.jpg"></div>
  <div class="photo"><img src="img3.jpg"></div>
  <div class="photo"><img src="img4.jpg"></div>
  <div class="photo"><img src="img5.jpg"></div>
  <div class="photo"><img src="img6.jpg"></div>
  <div class="photo"><img src="img7.jpg"></div>
  <div class="photo"><img src="img8.jpg"></div>
  <div class="photo"><img src="img9.jpg"></div>
  <div class="photo"><img src="img10.jpg"></div>

</div>

<div class="message">
  I don’t need perfect moments, I just need you in every imperfect one.  
  Thank you for these 3 months of love, laughter, and peace 💗
</div>

<script>
// softer floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 12 + 12 + "px";
  heart.style.animationDuration = (Math.random() * 5 + 6) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 11000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
