<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Us 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

<style>

/* 🎥 videos in a row */
.video-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

/* 🖼️ image grid (2 rows of 3) */
.image-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 180px;
  gap: 15px;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

/* video style */
.video video {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 18px;
}

/* image style */
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
  .photo {
  border-radius: 18px;
  overflow: hidden;
  background: white;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  height: 100%;
}

/* shared card style */
.video, .photo {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transition: 0.3s ease;
}

.video:hover, .photo:hover {
  transform: scale(1.03);
}

.photo:hover {
  transform: scale(1.05);
}

/* 🌸 background */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #ffc0cb;
  background-image: radial-gradient(#ffb6c1 1px, transparent 1px);
  background-size: 20px 20px;
}

/* floral overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("https://www.transparenttextures.com/patterns/flowers.png");
  opacity: 0.18;
  z-index: -2;
}

/* 💗 title */
.title {
  font-family: 'Dancing Script', cursive;
  font-size: 3rem;
  font-style: italic;
  color: #ff4d6d;
  text-align: center;
  margin-top: 20px;
}

/* 🌸 hearts */
.heart {
  position: fixed;
  top: -20px;
  color: rgba(255,105,180,0.4);
  pointer-events: none;
  z-index: 9999;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(0); opacity: 0.8; }
  100% { transform: translateY(110vh); opacity: 0; }
}

/* 🎥 VIDEO GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  padding: 30px;
  max-width: 1000px;
  margin: auto;
}

.video {
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transition: 0.4s ease;
  background: white;
}

.video:hover {
  transform: scale(1.03);
}

.video video {
  width: 100%;
  height: 250px;
  object-fit: cover;
}

/* 💌 message box */
.message {
  max-width: 700px;
  margin: 40px auto;
  text-align: center;
  padding: 25px;
  color: #444;
  font-size: 1.1rem;
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(6px);
  border-radius: 20px;
}

.extra {
  margin-top: 15px;
  font-style: italic;
  color: #666;
}

/* 🎵 music button */
.music-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff4d6d;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

/* 🎵 now playing */
.music-indicator {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(6px);
  padding: 10px 15px;
  border-radius: 20px;
  color: #ff4d6d;
  animation: float 2s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
  100% { transform: translateY(0); }
}

</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bg-music" loop>
  <source src="music/song.mp3" type="audio/mp3">
</audio>

<button class="music-btn" onclick="playMusic()">▶ Play Music</button>

<div class="music-indicator">🎵 Now Playing</div>

<!-- 💗 TITLE -->
<h1 class="title">Happy 3 Months 💗</h1>

<!-- 💌 HEADER -->
<header>
  <p style="text-align:center; color:#555;">
    Every moment with you feels like a dream
  </p>
</header>

<!-- 🎥 VIDEO GALLERY -->


<div class="gallery">

  <!-- 🎥 VIDEOS (TOP ROW) -->
  <div class="video-row">
    <div class="video"><video src="video1.mp4" controls></video></div>
    <div class="video"><video src="video2.mp4" controls></video></div>
    <div class="video"><video src="video3.mp4" controls></video></div>
  </div>

  <!-- 🖼️ IMAGES (BOTTOM GRID) -->
  <div class="image-grid">

    <div class="photo"><img src="picture1.jpeg"></div>
    <div class="photo"><img src="picture2.jpeg"></div>
    <div class="photo"><img src="picture3.jpeg"></div>

    <div class="photo"><img src="picture4.jpeg"></div>
    <div class="photo"><img src="picture5.jpeg"></div>
    <div class="photo"><img src="picture6.jpeg"></div>

  </div>

</div>

<!-- 💌 MESSAGE -->
<div class="message">
  I don’t need perfect moments, I just need you in every imperfect one.  
  Thank you for these 3 months of love, laughter, and peace 💗

  <p class="extra">
    Every day with you feels softer, warmer, and a little more like home.
  </p>
</div>

<!-- 🌸 HEARTS -->
<script>
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 12 + 12) + "px";
  heart.style.animationDuration = (Math.random() * 5 + 6) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 11000);
}
setInterval(createHeart, 300);
</script>

<!-- 🎵 MUSIC SCRIPT -->
<script>
function playMusic() {
  const music = document.getElementById("bg-music");
  music.volume = 0;

  music.play();

  let vol = 0;
  const fade = setInterval(() => {
    if (vol < 0.2) {
      vol += 0.02;
      music.volume = vol;
    } else {
      clearInterval(fade);
    }
  }, 200);
}
</script>

</body>
</html>
